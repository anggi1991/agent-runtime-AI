<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Agent Runtime AI Architecture</text>

  <rect x="80" y="190" width="180" height="90" rx="12" fill="#e8f0fe" stroke="#3367d6"/>
  <text x="170" y="225" text-anchor="middle" font-family="Arial" font-size="18">Business</text>
  <text x="170" y="250" text-anchor="middle" font-family="Arial" font-size="18">Application</text>

  <rect x="360" y="170" width="180" height="130" rx="12" fill="#e6f4ea" stroke="#188038"/>
  <text x="450" y="220" text-anchor="middle" font-family="Arial" font-size="18">Event Bus</text>
  <text x="450" y="250" text-anchor="middle" font-family="Arial" font-size="14">Publish / Subscribe</text>

  <rect x="650" y="100" width="190" height="90" rx="12" fill="#fce8e6" stroke="#d93025"/>
  <text x="745" y="140" text-anchor="middle" font-family="Arial" font-size="18">AI Agent</text>
  <text x="745" y="165" text-anchor="middle" font-family="Arial" font-size="14">Autonomous Worker</text>

  <rect x="650" y="260" width="190" height="90" rx="12" fill="#fff4e5" stroke="#f29900"/>
  <text x="745" y="300" text-anchor="middle" font-family="Arial" font-size="18">Pipeline</text>
  <text x="745" y="325" text-anchor="middle" font-family="Arial" font-size="14">Workflow Steps</text>

  <rect x="950" y="170" width="170" height="130" rx="12" fill="#f3e8fd" stroke="#9334e6"/>
  <text x="1035" y="220" text-anchor="middle" font-family="Arial" font-size="18">AI Provider</text>
  <text x="1035" y="250" text-anchor="middle" font-family="Arial" font-size="14">OpenAI / Local LLM</text>

  <line x1="260" y1="235" x2="360" y2="235" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="540" y1="220" x2="650" y2="145" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="540" y1="250" x2="650" y2="305" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="840" y1="145" x2="950" y2="220" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="840" y1="305" x2="950" y2="250" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
